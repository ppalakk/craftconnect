<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CraftConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans antialiased">

    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
            
            <div class="bg-emerald-700 px-8 py-6 text-white text-center">
                <span class="text-3xl">🌿</span>
                <h2 class="text-2xl font-bold mt-2">Welcome Back</h2>
                <p class="text-emerald-100 text-sm mt-1">Sign in to access your artisan dashboard</p>
            </div>

            <!-- Form Section -->
            <form id="loginForm" class="p-8 space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email or Phone Number</label>
                    <input type="text" id="email" name="email" required 
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition duration-200 text-gray-800 placeholder-gray-400"
                        placeholder="e.g. sita@artisan.com">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" name="password" required 
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition duration-200 text-gray-800 placeholder-gray-400"
                        placeholder="••••••••">
                </div>
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center text-gray-600 cursor-pointer">
                        <input type="checkbox" class="rounded border-gray-300 text-emerald-600 focus:ring-emerald-500 w-4 h-4 mr-2">
                        Remember me
                    </label>
                    <a href="#" class="text-emerald-600 hover:text-emerald-700 font-medium">Forgot password?</a>
                </div>

                <button type="submit" 
                    class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-md hover:shadow-lg">
                    Sign In
                </button>
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <span class="flex-shrink mx-4 text-gray-400 text-xs uppercase tracking-wider">or</span>
                    <div class="flex-grow border-t border-gray-200"></div>
                </div>

              
               <!-- Google Sign In Button -->
         <button type="button" onclick="window.location.href='index.html'"
        class="w-full bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-sm hover:shadow flex items-center justify-center space-x-3 cursor-pointer">
        <!-- Direct Inline SVG for Google Logo -->
        <svg class="w-5 h-5" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.15v3.14C3.15 21.36 7.23 24 12 24z"/>
        <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.15C.42 8.09 0 9.75 0 11.5s.42 3.41 1.15 4.88l4.12-3.14z"/>
         <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.64 1.15 6.62l4.12 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/>
         </svg>
         <span>Sign in with Google</span>
         </button>
                <p class="text-center text-sm text-gray-600">
                    Don't have an account? 
                    <a href="#" class="text-emerald-600 hover:text-emerald-700 font-semibold">Register now</a>
                </p>

            </form>
        </div>
    </div>

    <!-- JavaScript to handle redirection -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); 
            window.location.href = 'index.html';
        });
    </script>

</body>
</html>
